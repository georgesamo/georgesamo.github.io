name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # rebuild every 3 hours so /news/ stays fresh (the feeds are fetched at build time, not committed)
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # browser tests (tests/index.html) in headless Chrome; a failure stops the deploy
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Playwright (uses the runner's Chrome, no browser download)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.49.1
      - name: Serve the repo on 127.0.0.1:4100
        run: |
          python3 tests/serve.py 4100 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/tests/ > /dev/null && break; sleep 0.5; done
      - name: Run tests
        run: node tests/ci.mjs http://127.0.0.1:4100/tests/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v6
      # the last run's news/videos, so stories and reviews pile up across runs (feeds only list the newest few)
      - name: Restore the last run's feeds
        uses: actions/cache/restore@v6
        with:
          path: |
            _data/news.json
            _data/videos.json
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - name: Fetch news feeds and YouTube channels
        run: bundle exec ruby scripts/fetch_news.rb || echo "::warning::feed fetch failed, building with the last copy"
      - name: Keep the feeds for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            _data/news.json
            _data/videos.json
          key: feeds-${{ github.run_id }}
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install build tools (esbuild, Playwright with the runner's Chrome)
        run: npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.24.0 playwright@1.49.1
      - name: Optimize (minify JS/CSS, content-hash asset links)
        run: node scripts/optimize.mjs _site
      - name: Smoke-test the optimized site
        run: |
          (cd _site && python3 ../tests/serve.py 4200 > /tmp/site.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4200/ > /dev/null && break; sleep 0.5; done
          node tests/smoke.mjs http://127.0.0.1:4200
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
