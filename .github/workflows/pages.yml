name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # any branch can be run by hand: everything but the deploy runs, so CI changes can be tried first
  workflow_dispatch:
  # rebuild every 3 hours so /news/ stays fresh (the feeds are fetched at build time, not committed)
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  NPM_TOOLS: esbuild@0.24.0 playwright@1.49.1
  NPM_CACHE: npm-esbuild-0.24.0-playwright-1.49.1   # bump together with NPM_TOOLS

# test ─┐
#       ├─ deep (smoke + deep test of the built site) ─ deploy (main only)
# build ┘
# Unit tests and the build run side by side; the deep test needs both, the deploy needs it.
jobs:
  # browser unit tests (tests/index.html) in headless Chrome
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.NPM_CACHE }}
      - name: Install Playwright (uses the runner's Chrome, no browser download)
        run: npm install --no-save --no-package-lock --no-audit --no-fund ${{ env.NPM_TOOLS }}
      - name: Serve the repo on 127.0.0.1:4100
        run: |
          python3 tests/serve.py 4100 > /tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/tests/ > /dev/null && break; sleep 0.5; done
      - name: Unit tests
        run: node tests/ci.mjs http://127.0.0.1:4100/tests/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v6
      # the last run's news/videos, so stories and reviews pile up across runs (feeds only list the newest few)
      - name: Restore the last run's feeds
        uses: actions/cache/restore@v6
        with:
          path: |
            _data/news.json
            _data/videos.json
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - name: Fetch news feeds and YouTube channels
        run: bundle exec ruby scripts/fetch_news.rb || echo "::warning::feed fetch failed, building with the last copy"
      - name: Keep the feeds for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            _data/news.json
            _data/videos.json
          key: feeds-${{ github.run_id }}
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.NPM_CACHE }}
      - name: Install build tools
        run: npm install --no-save --no-package-lock --no-audit --no-fund ${{ env.NPM_TOOLS }}
      - name: Optimize (minify JS/CSS, content-hash asset links)
        run: node scripts/optimize.mjs _site
      # the exact files that get deployed; the deep job tests this same artifact
      - uses: actions/upload-pages-artifact@v5

  # smoke + deep test of the built, optimized site (tests/deep.mjs = the automated half of /deep-test)
  deep:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.NPM_CACHE }}
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund ${{ env.NPM_TOOLS }}
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: /tmp/pages
      - name: Serve it on 127.0.0.1:4200
        run: |
          mkdir -p _site && tar -xf /tmp/pages/artifact.tar -C _site
          (cd _site && python3 ../tests/serve.py 4200 > /tmp/site.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4200/ > /dev/null && break; sleep 0.5; done
      - name: Smoke test
        run: node tests/smoke.mjs http://127.0.0.1:4200
      - name: Deep test
        # --strict: warnings (visual, a11y, tap targets) block the deploy too, not just errors.
        # To ship past a known false alarm, drop the flag in a PR and say why.
        run: node tests/deep.mjs http://127.0.0.1:4200 --strict
      - name: Keep the deep-test report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-report
          path: deep-report/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: [test, deep]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000   # 30 min: when GitHub is slow, Pages can sit in "syncing files" past the 10 min default
