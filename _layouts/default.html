<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07110c">
  <script>
    // apply saved theme before paint (no flash)
    // cached role is cosmetic only (picks the theme before paint); auth.js verifies it with Supabase
    try {
      var d = document.documentElement, t = localStorage.getItem("samuka-theme"), r = localStorage.getItem("samuka-role") || "guest";
      var need = { knight: "samuka", golden: "nino" };
      d.dataset.role = r;
      if (t === "light" || t === "dark" || (need[t] && need[t] === r)) d.dataset.theme = t;
    } catch (e) {}
    document.documentElement.classList.add("js");
  </script>
  {% seo title=false %}
  <title>{% if page.url != "/" and page.title %}{{ page.title }} · {% endif %}Samuka · Giorgi Samukashvili, Senior Ruby on Rails Engineer</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Georgian:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/arcade.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/themes.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ content }}
  <script id="resume-data" type="application/json">{{ site.data.resume | jsonify }}</script>
  <script>window.SITE = { contactEndpoint: {{ site.contact_endpoint | jsonify }}, resumePdf: {{ '/assets/samuka-resume.pdf' | relative_url | jsonify }}, supabase: {{ site.supabase | jsonify }} };</script>
  {%- if site.supabase.url != "" and site.supabase.anon_key != "" %}
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js" defer></script>
  {%- endif %}
  <script src="{{ '/assets/js/auth.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/glitch.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/gem.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/terminal.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/arcade.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/games/sidekiq-rush.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/games/gem-match.js' | relative_url }}" defer></script>
</body>
</html>
