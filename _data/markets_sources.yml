# /news/ · markets tab (scripts/fetch_markets.rb)
#
# tickers: what gets quotes, company news and tracked calls. `aliases` are other names a
#          headline may use for the company (the free rules in scripts/markets_rules.rb match
#          them). Keep sector names to the list under `sectors` so the pressure strip groups them.
# events:  scheduled catalysts no free API lists cleanly (central banks, macro data, tech
#          conferences). Earnings dates for the tickers are added automatically.
#          Check dates against the official source.

tickers:
  AAPL:  { name: Apple, sector: Technology, aliases: [iPhone] }
  MSFT:  { name: Microsoft, sector: Technology, aliases: [Azure] }
  NVDA:  { name: NVIDIA, sector: Semiconductors, aliases: [Nvidia, Jensen Huang] }
  AMD:   { name: AMD, sector: Semiconductors, aliases: [Advanced Micro Devices] }
  AVGO:  { name: Broadcom, sector: Semiconductors, aliases: [Broadcom] }
  TSM:   { name: TSMC, sector: Semiconductors, aliases: [TSMC, Taiwan Semiconductor] }
  GOOGL: { name: Alphabet, sector: Communication, aliases: [Google, Alphabet] }
  META:  { name: Meta, sector: Communication, aliases: [Meta Platforms, Facebook, Instagram] }
  NFLX:  { name: Netflix, sector: Communication, aliases: [Netflix] }
  AMZN:  { name: Amazon, sector: Consumer Discretionary, aliases: [Amazon, AWS] }
  TSLA:  { name: Tesla, sector: Consumer Discretionary, aliases: [Tesla] }
  WMT:   { name: Walmart, sector: Consumer Staples, aliases: [Walmart] }
  JPM:   { name: JPMorgan Chase, sector: Financials, aliases: [JPMorgan, JP Morgan] }
  GS:    { name: Goldman Sachs, sector: Financials, aliases: [Goldman] }
  V:     { name: Visa, sector: Financials, aliases: [Visa] }
  XOM:   { name: Exxon Mobil, sector: Energy, aliases: [Exxon, ExxonMobil] }
  CVX:   { name: Chevron, sector: Energy, aliases: [Chevron] }
  LLY:   { name: Eli Lilly, sector: Healthcare, aliases: [Eli Lilly, Lilly, Zepbound, Mounjaro] }
  UNH:   { name: UnitedHealth, sector: Healthcare, aliases: [UnitedHealth] }
  CAT:   { name: Caterpillar, sector: Industrials, aliases: [Caterpillar] }
  BA:    { name: Boeing, sector: Industrials, aliases: [Boeing] }
  SPY:   { name: S&P 500, sector: Index, aliases: ["S&P 500", "S&P"] }
  QQQ:   { name: Nasdaq 100, sector: Index, aliases: [Nasdaq 100, Nasdaq] }

sectors:
  - Technology
  - Semiconductors
  - Communication
  - Consumer Discretionary
  - Consumer Staples
  - Financials
  - Energy
  - Healthcare
  - Industrials
  - Materials
  - Utilities
  - Real Estate
  - Crypto
  - Index

events:
  - id: fomc-2026-12
    name: FOMC rate decision
    kind: macro
    starts_on: 2026-12-08
    ends_on: 2026-12-09
    importance: 3
    details: Last Fed meeting of 2026; statement, dot plot and press conference on day two (federalreserve.gov).
