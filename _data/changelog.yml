# What's new in the arcade, newest first. Shown on the lobby (latest three) and on /whats-new/.
#   tag   game | music | feature | fix
#   link  optional, a page on this site
- date: 2026-11-12
  tag: feature
  title: Your week, on the Today page
  text: A new card sums up your week since Monday. It shows your best score in each game you played, with an arrow when you beat last week, plus your streak, how many games you played, and any badges or director's cuts you unlocked. Nothing played yet? It points you to today's daily.
  link: /events/

- date: 2026-11-12
  tag: feature
  title: Play on the go, even offline
  text: Add the arcade to your home screen and it opens like an app. The lobby, the games page, every game and the soundtrack are kept on your device, so Gem Match and friends still play with no signal (scores, leaderboards and live games still need a connection). A new version of the site is picked up straight away.
  link: /games/

- date: 2026-11-12
  tag: feature
  title: How the games are built
  text: Each game now has a short case study for anyone who'd rather read than play, covering what it is, what it shows technically and the decisions behind it. Find them under "how it's built" on every game card, or on the Hiring page.
  link: /games/sidekiq/about/

- date: 2026-11-12
  tag: feature
  title: Find out who beat your challenge
  text: Send a challenge while signed in and you'll hear back. When a friend beats your score, your next visit shows who won and by how much, with a link to win it back on the same board. Look for the dot on Games.

- date: 2026-11-12
  tag: fix
  title: Better with a keyboard and screen reader
  text: The game window, the phone "more" sheet and the first-visit tour now keep Tab inside them and hand focus back when they close. Switching pages announces the new page, the sidebar marks where you are, and the look and calm-mode choices in Settings show a focus ring.

- date: 2026-11-12
  tag: fix
  title: Broken things get noticed
  text: If a page or game hits a JavaScript error on your device, the site now sends a short, anonymous note (what broke, on which page, and the browser, e.g. "Safari 17 on iOS") so it can be fixed without you having to report it. No account, nickname, email or IP is attached.

- date: 2026-11-12
  tag: fix
  title: Easier-to-read grey text
  text: Labels, dates and captions were a little too faint, especially in light mode. They're now dark enough to read comfortably in every skin. With calm mode on, Sidekiq Rush's preview no longer hides its queue names and Pit Wall's cars stay on the track.

- date: 2026-11-12
  tag: fix
  title: The music player loads when you want it
  text: The soundtrack is the biggest part of the site; it now loads the first time you reach for ♪ (or open a page that shows the music), so every other page starts faster.

- date: 2026-11-12
  tag: feature
  title: Link previews for cards and challenges
  text: Paste a player card or a challenge into a chat app and it now shows a proper preview, with the card itself or the game you've been challenged at.

- date: 2026-11-12
  tag: feature
  title: A tidier tab bar
  text: On desktop, News, Trailers, What's new and the Blog now share one Feeds tab, so the top bar reads Home, Games, Today, Leaderboards, Feeds, About.

- date: 2026-11-12
  tag: feature
  title: A quick tour for first visits
  text: New here? Three small pointers show where to play, what's on today and where your bests and badges collect. Replay it from Settings any time.
  link: /?tour=1

- date: 2026-11-12
  tag: feature
  title: Streak reminder
  text: "Signed in with a daily streak going? Home and Today now tell you how long you have left to keep it, and a dot appears on Today. Hide it for the day, or switch it off in Settings."
  link: /events/

- date: 2026-11-12
  tag: feature
  title: A page for recruiters
  text: "Hiring? Start here: one page with Samuka's experience, stack, highlights and how to get in touch, plus the résumé PDF."
  link: /hire/

- date: 2026-11-12
  tag: feature
  title: Calm mode
  text: One switch in Settings for no screen shake, glitches, spinning or sliding animations. By default it follows your device's reduced-motion setting.
  link: /settings/

- date: 2026-11-11
  tag: feature
  title: One Settings page
  text: Light or dark, skin, music, live cursors and your account now live together on one page. Find it in the sidebar, under More on phones, or in your avatar menu.
  link: /settings/

- date: 2026-11-11
  tag: fix
  title: Lighter pages
  text: A game's code now loads when you open it (or hover its play button), instead of all four on every page.

- date: 2026-11-11
  tag: feature
  title: A simpler bottom bar on phones
  text: Home, Games, Today, Me and More. Today gathers the daily puzzle, live races, the leaderboards and this week's challenge in one place.
  link: /events/

- date: 2026-11-11
  tag: feature
  title: Challenge a friend
  text: Finished a run you're proud of? Send it as a link. Your friend plays the exact same board whenever they like, and you both see who won. Works without an account.
  link: /games/

- date: 2026-11-11
  tag: game
  title: What next, after every game
  text: The end-of-game card now shows what you just unlocked, where you rank on the all-time board, and one idea for what to play next.
  link: /games/

- date: 2026-11-11
  tag: feature
  title: A friendlier lobby and clearer menus
  text: Everything has a plain name now (Home, Games, News…), the lobby gets you into a game in one click, and this page tells you what changed.
  link: /

- date: 2026-11-10
  tag: feature
  title: News and trailers
  text: Tech, gaming and Ruby headlines gathered every few hours, plus official trailers and reviews. The music pauses while a video plays.
  link: /news/

- date: 2026-11-10
  tag: music
  title: The soundtrack, remastered
  text: Every track is pre-rendered and loudness-balanced, songs flow into each other, and the player keeps going on phones in the background.

- date: 2026-11-10
  tag: fix
  title: Smoother on phones
  text: No more black strip under the bottom menu on Android, nothing left running after you leave a game, and a much lighter idle.

- date: 2026-11-09
  tag: music
  title: A bonus track for every game
  text: Finish a game to unlock its own track in the ♪ player. Unlocked tracks join the shuffle.

- date: 2026-11-09
  tag: game
  title: Every game fits a phone
  text: All four games resize to the screen, and the card previews stop animating while you play.
  link: /games/

- date: 2026-11-08
  tag: game
  title: "Pit Wall: World Championship"
  text: Ten circuits, varied weather, incidents and a 10-round season. Smoother cars, too.
  link: /games/

- date: 2026-11-08
  tag: feature
  title: Play first, sign in later
  text: Guests can play every game. Sign in when you want your score on the boards, plus ranks, streaks and Ctrl+P to jump anywhere.

- date: 2026-11-08
  tag: game
  title: "New game: Schema Stack"
  text: Falling migrations, pending changes and create_table first. A puzzle for anyone who has ever broken a deploy.
  link: /games/

- date: 2026-11-08
  tag: feature
  title: Live 1v1, weekly events and the commit wall
  text: Race a friend live, take the weekly challenge, and leave a line on the visitors' wall.
  link: /events/
