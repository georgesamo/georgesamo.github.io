# YouTube channels for /watch/. scripts/fetch_news.rb reads their public feeds
# (youtube.com/feeds/videos.xml?channel_id=…) and writes _data/videos.json. Videos play in
# YouTube's own embedded player; Shorts, streams of unrelated stuff and #sponsored posts are skipped.
#   kind: trailers  official publisher channels: everything they post counts as a trailer
#         reviews   critics: only videos with "review" in the title
#         both      outlets: "review" titles → reviews, trailer-ish titles → trailers, the rest is skipped
#   channel:  the channel id (UC…). To find one: open the channel page, View source, search "externalId".
#   playlist: a playlist id (PL…) instead of a channel, e.g. an outlet's "Game Reviews" playlist
# A feed only lists a channel's last 15 uploads, so results are merged with earlier runs
# (CI keeps them between deploys) and pile up over the 30-day window.
