title: Samuka
tagline: Senior Ruby on Rails Engineer
description: >-
  Samuka (Giorgi Samukashvili), Senior Ruby on Rails engineer in Tbilisi, Georgia,
  building reliable backend systems for healthcare: APIs, HL7 FHIR integrations,
  PostgreSQL and Sidekiq.
url: "https://georgesamo.github.io"
baseurl: ""
lang: en_US
author:
  name: Giorgi Samukashvili
  url: "https://georgesamo.github.io"
social:
  name: Giorgi Samukashvili
  links:
    - https://github.com/georgesamo
twitter:
  card: summary_large_image

# link-preview image for every page (jekyll-seo-tag reads it per page)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Contact form: FormSubmit forwards messages by email. No account needed;
# the very first submission sends a one-time activation email to this address.
contact_endpoint: "https://formsubmit.co/ajax/giorgisamo@gmail.com"

# Accounts (Supabase). Both values are public by design; leave empty to
# disable sign-in (the arcade then stays open to everyone).
# NEVER put the service_role / secret key here.
supabase:
  url: "https://qgxboopayhgppckvwmhr.supabase.co"
  anon_key: "sb_publishable_vTZs4VUSNq84BlFf6A6-aQ_1FZE1n-F"
  github: false        # show "Sign in with GitHub" (needs the GitHub provider enabled)

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
  - scripts
  - supabase
  - tests
  - node_modules     # CI installs build tools; a custom exclude list replaces Jekyll's defaults
  - package.json
  - package-lock.json

markdown: kramdown
